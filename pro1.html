<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>POU Hoodie Black Edition | POU COLLECTION</title>
  <style>
    body {
      margin: 0;
      font-family: 'Arial', sans-serif;
      background-color: white;
      color: black;
      padding: 40px 20px;
      line-height: 1.6;
    }

    .container {
      max-width: 1200px;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      gap: 40px;
    }

    .back-button {
      display: inline-block;
      padding: 10px 25px;
      border: 2px solid black;
      text-decoration: none;
      color: black;
      font-weight: bold;
      text-transform: uppercase;
      transition: background-color 0.3s ease, color 0.3s ease;
      align-self: flex-start;
    }

    .back-button:hover {
      background-color: black;
      color: white;
    }

    .product-section {
      display: flex;
      flex-wrap: wrap;
      align-items: flex-start;
      gap: 50px;
    }

    /* IMAGE COLUMN */
    .product-images {
      flex: 1 1 500px;
      display: flex;
      flex-direction: column;
      gap: 20px;
      align-items: center; /* center images horizontally inside this column */
      justify-content: flex-start;
      margin: 0 auto; /* center the whole column horizontally if space allows */
    }

    .product-images img {
      width: 100%;
      max-width: 500px;
      height: auto;
      max-height: 500px;
      object-fit: cover;
      display: block;
      border: none;
    }

    .product-info {
      flex: 1 1 400px;
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      text-align: left;
    }

    .title {
      font-family: 'Arial Black', sans-serif;
      font-size: 2rem;
      margin-bottom: 10px;
    }

    .price {
      font-size: 1.6rem;
      font-weight: bold;
      margin-bottom: 25px;
    }

    .description {
      max-width: 600px;
      margin-bottom: 40px;
      font-size: 1rem;
    }

    .purchase-button {
      display: inline-block;
      padding: 20px 70px;
      border: 3px solid black;
      color: white;
      background-color: black;
      text-transform: uppercase;
      font-weight: bold;
      letter-spacing: 1px;
      cursor: pointer;
      font-size: 1.2rem;
      transition: all 0.3s ease;
      position: relative;
      overflow: hidden;
      text-decoration: none;
      text-align: center;
      max-width: 100%;
      box-sizing: border-box;
      word-wrap: break-word;
    }

    .purchase-button:hover {
      background-color: white;
      color: black;
      transform: scale(1.05);
    }

    /* pulse click animation */
    .purchase-button:active::after {
      content: '';
      position: absolute;
      top: 50%;
      left: 50%;
      width: 10px;
      height: 10px;
      background: rgba(0, 0, 0, 0.2);
      border-radius: 50%;
      transform: translate(-50%, -50%) scale(1);
      animation: pulse 0.5s ease-out;
    }

    @keyframes pulse {
      to {
        transform: translate(-50%, -50%) scale(20);
        opacity: 0;
      }
    }

    footer {
      text-align: left;
      margin-top: 80px;
      border-top: 2px solid black;
      padding-top: 20px;
      font-size: 0.9rem;
    }

    @media (max-width: 768px) {
      .product-section {
        flex-direction: column;
        align-items: center; /* center all on mobile */
      }
      .product-images {
        margin: 0;
      }
      .product-images img {
        max-width: 100%;
        max-height: 400px;
      }
      .title {
        font-size: 1.8rem;
      }
      .price {
        font-size: 1.4rem;
      }
      .purchase-button {
        width: 100%;
        padding: 18px 20px;
        font-size: 1rem;
      }
    }
  </style>
</head>
<body>

  <div class="container">
    <a href="index.html" class="back-button">Back</a>

    <div class="product-section">
      <div class="product-images">
        <img src="pro1.png" alt="POU Hoodie Front">
        <img src="stuff1.png" alt="POU Hoodie Back">
      </div>

      <div class="product-info">
        <div class="title">Great Hoodie</div>
        <div class="price">€69.00</div>

        <div class="description">
         The best fucking collab to ever exist Description Description DescriptionDescription Description Description
Description Description Description Description Description 
        </div>

        <a href="a.html" class="purchase-button">PURCHASE</a>
      </div>
    </div>

    <footer>
      &copy; 2025 POU COLLECTION — All rights reserved.
    </footer>
  </div>

</body>
</html>
